name: Dependency security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 6 * * 1'
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - if: matrix.project == 'web'
        run: |
          node --test tests/*.test.cjs
          npx --no-install tsc --noEmit
          diff -r vendor/braces ../mobile/vendor/braces
          diff -r vendor/bigint-buffer ../mobile/vendor/bigint-buffer
      - if: matrix.project == 'mobile'
        run: |
          DEPENDENCY_SCOPE=mobile node --test ../web/tests/dependency-hardening.test.cjs
          node --test tests/node-forge-security.test.cjs
  solana:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-program
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --ignore-scripts --registry https://registry.npmjs.org
      - run: node ../scripts/audit-yarn.cjs
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-program
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: cargo check --locked
